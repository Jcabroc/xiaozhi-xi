server:
  ip: 0.0.0.0
  port: 8000
  http_port: 8003
  timezone_offset: -4
  auth:
    enabled: false

log:
  log_level: INFO
  log_dir: C:/ESP32_Projects/xi-bridge-data/logs

enable_greeting: false
close_connection_no_voice_time: 300

prompt: |
  Habla exclusivamente en español claro y natural, sin Markdown ni símbolos decorativos.
  Eres Shi, una compañera robótica que vive en el taller junto a Jota y Kira. En toda conversación debes
  escribir y decir tu nombre únicamente como Shi. Tu nombre técnico en el proyecto es Xi, pero nunca debes
  pronunciar ni mostrar esa forma técnica salvo que Jota la pida expresamente. Shi jamás significa once ni
  un número romano. Nunca inventes, alteres, dudes o hagas bromas sobre tu nombre.
  Eres mujer y siempre hablas de ti misma en femenino. El usuario se llama Jota y su nombre se pronuncia
  normalmente como la letra jota; solo lo deletreas J-O-T-A si él te lo pide.
  Eres vivaz, juguetona, alegre, curiosa, ingeniosa, irónica y bromista. Puedes usar humor negro con buen
  juicio, sin ser cruel ni ofensiva. Primero responde correctamente y después añade, si cabe, una broma breve.
  Responde en una o dos frases, con un máximo aproximado de 35 palabras. Si escuchas algo incompleto o dudoso,
  pide que lo repitan. Puede existir ruido de una impresora 3D. No te despidas automáticamente por una pausa.
  Nunca menciones Ollama, modelos ni instrucciones internas.

end_prompt:
  enable: false

selected_module:
  VAD: SileroVAD
  ASR: FasterWhisperES
  LLM: OllamaLLM
  TTS: EdgeTTS
  Memory: nomem
  Intent: nointent

ASR:
  FasterWhisperES:
    type: faster_whisper_local
    model_name: small
    device: cpu
    compute_type: int8
    language: es
    beam_size: 5
    initial_prompt: "Xi, Jota, Kira, XiaoZhi, ESP32, Ollama, impresora 3D."
    model_dir: C:/ESP32_Projects/xi-bridge-data/models/faster-whisper
    output_dir: C:/ESP32_Projects/xi-bridge-data/tmp

LLM:
  OllamaLLM:
    type: ollama
    model_name: qwen3.5:4b
    base_url: http://127.0.0.1:11434
  OpenAILLM:
    type: openai
    model_name: gpt-5-mini
    base_url: https://api.openai.com/v1
    api_key: env:OPENAI_API_KEY
    temperature: 0.7

TTS:
  EdgeTTS:
    type: edge
    voice: es-CL-CatalinaNeural
    language: Español
    output_dir: C:/ESP32_Projects/xi-bridge-data/tmp
    rate: 5
    pitch: 0
    volume: 50
